<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Transparent background is native to SVG unless a rect is explicitly drawn -->
  
  <g transform="translate(30, 20)">
    <!-- Outer left speed tail -->
    <polygon points="50,250 180,100 210,120 90,290" fill="#DC2626" opacity="0.9" />
    
    <!-- Inner left speed tail -->
    <polygon points="70,320 220,130 270,150 120,380" fill="#EF4444" opacity="0.95" />
    
    <!-- Main 'L' Vertical Stem -->
    <polygon points="120,380 250,180 320,230 200,420" fill="#DC2626" />
    
    <!-- Top right point (Meteor core/head) -->
    <polygon points="250,180 350,50 390,120 320,230" fill="#FF6B35" />
    <polygon points="350,50 420,30 390,120" fill="#EF4444" />
    <polygon points="390,120 420,30 450,100 380,180" fill="#991B1B" />
    
    <!-- Secondary inner tail -->
    <polygon points="240,280 380,180 400,210 270,320" fill="#FF6B35" />
    
    <!-- Main 'L' Horizontal Base -->
    <polygon points="120,380 200,420 350,420 400,360 250,360" fill="#EF4444" />
    
    <!-- Base 3D depth/shadow fragment -->
    <polygon points="200,420 300,470 350,420" fill="#111111" opacity="0.8" />
    
    <!-- Outer right speed lines -->
    <polygon points="270,350 420,230 450,260 300,390" fill="#FF6B35" opacity="0.8" />
  </g>
</svg>
