name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumina/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check-openapi
      - run: pnpm --filter @lumina/core test

  qodana:
    name: Qodana Static Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          upload-result: true
          args: |
            --linter qodana-js
            --within-docker false
            --profile-name qodana.recommended
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  build-packages:
    name: Build packages and demos
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumina/db generate
      - run: pnpm build
      - run: pnpm --filter @lumina/demo-web build

  container-security:
    name: Production image vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API production image
        run: |
          docker build \
            --pull \
            -f demo/api/Dockerfile \
            -t lumina-api:${{ github.sha }} .

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lumina-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
