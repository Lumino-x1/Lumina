# Local development infrastructure (Postgres + Redis).
# Run apps with pnpm: `pnpm dev:api` and `pnpm dev:web`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumina_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_password}
      POSTGRES_DB: ${POSTGRES_DB:-lumina_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lumina_user} -d ${POSTGRES_DB:-lumina_dev}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
