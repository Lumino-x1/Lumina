openapi: 3.1.0
info:
  title: Lumina API
  version: 1.0.0
  description: Existing internal endpoints are mounted below /api. New public endpoints use /api/v1.
servers:
  - url: http://localhost:3000
security:
  - sessionCookie: []
paths:
  /api/profile/me:
    get:
      summary: Get the current user's profile
      responses:
        '200':
          description: Profile returned
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      summary: Update or create the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated profile returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/friends:
    get:
      summary: List accepted friends
      responses:
        '200':
          description: Friends returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/friends/request/{userId}:
    post:
      summary: Send a friend request
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Friend request sent
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/friends/request/{requestId}/accept:
    patch:
      summary: Accept a friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Friend request accepted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/friends/request/{requestId}/reject:
    patch:
      summary: Reject a friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Friend request rejected
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/friends/request/{requestId}:
    delete:
      summary: Cancel a friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Friend request cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/friends/{friendId}:
    delete:
      summary: Remove a friend
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Friend removed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/friends/mutual/{userId}:
    get:
      summary: Get mutual friends
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mutual friends returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/friends/requests/incoming:
    get:
      summary: Get incoming friend requests
      responses:
        '200':
          description: Incoming requests returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/friends/requests/outgoing:
    get:
      summary: Get outgoing friend requests
      responses:
        '200':
          description: Outgoing requests returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/posts:
    post:
      summary: Create a post with optional media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                visibility:
                  type: string
                  enum:
                    - PUBLIC
                    - COLLEGE
                    - FRIENDS
                    - PRIVATE
                media:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Post created
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/posts/saved:
    get:
      summary: Get saved posts
      responses:
        '200':
          description: Saved posts returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/posts/{id}/like:
    post:
      summary: Like a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post liked
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/posts/{id}/likes/count:
    get:
      summary: Get post like count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Like count returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/posts/{id}/comments:
    get:
      summary: Get comments for a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comments returned
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Add a comment to a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Comment created
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/posts/{id}/comments/{commentId}/pin:
    patch:
      summary: Pin or unpin a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment pin status updated
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/posts/{id}/comments/{commentId}:
    delete:
      summary: Delete a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Comment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/posts/{id}/save:
    post:
      summary: Save a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post saved
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/leaderboard:
    get:
      summary: Get the paginated coding leaderboard
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Leaderboard page returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/leaderboard/me:
    get:
      summary: Get the current user's rank and solved count
      responses:
        '200':
          description: Current user leaderboard stats returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/leaderboard/me/around:
    get:
      summary: Get users ranked near the current user
      responses:
        '200':
          description: Nearby leaderboard entries returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/leaderboard/{userId}:
    get:
      summary: Get leaderboard stats for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User leaderboard stats returned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found on the leaderboard

  /api/v1/video/token:
    post:
      summary: Generate a Stream Video user JWT token
      responses:
        '200':
          description: Video token returned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many video token requests

  /api/v1/video/calls:
    post:
      summary: Create a 1-on-1 or group video call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum:
                    - ONE_ON_ONE
                    - GROUP
                    - MENTORSHIP
                    - CLUB_MEETING
                    - FACULTY_SESSION
                title:
                  type: string
                  maxLength: 120
                participantIds:
                  type: array
                  maxItems: 50
                  items:
                    type: string
      responses:
        '201':
          description: Video call created
        '400':
          description: Invalid call payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many call creation attempts

  /api/v1/video/calls/history:
    get:
      summary: Get the current user's video call history
      responses:
        '200':
          description: Call history returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/video/calls/{callId}:
    get:
      summary: Get video call details and participant status
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Call details returned
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/video/calls/{callId}/join:
    post:
      summary: Authorize join and return Stream call credentials
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Join authorized
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a participant

  /api/v1/video/calls/{callId}/respond:
    post:
      summary: Accept or decline a video call invitation
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              additionalProperties: false
              properties:
                response:
                  type: string
                  enum:
                    - ACCEPT
                    - REJECT
      responses:
        '200':
          description: Invitation response recorded
        '400':
          description: Invalid response payload
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/video/calls/{callId}/end:
    post:
      summary: End an active video call as the host
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Call ended
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
