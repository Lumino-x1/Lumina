  /api/posts/{id}/schedule:
    post:
      summary: Schedule a draft post for publication
      description: Schedules an eligible draft post to be automatically published at a
        future timestamp. Dispatches an outbox event and schedules a BullMQ
        background job.
      operationId: schedulePost
      tags:
        - Publishing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Post ID to schedule
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/JsonContentType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePostInput"
      responses:
        "201":
          description: Post scheduled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Post scheduled successfully
                  data:
                    $ref: "#/components/schemas/Post"
        "400":
          description: Invalid scheduling time or post not in eligible draft state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the author may schedule this post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Concurrent update conflict (optimistic lock version mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Reschedule an existing scheduled post
      description: Updates the scheduled publishing time of a currently scheduled
        post. Increments scheduleVersion and reschedules the background
        publishing job.
      operationId: reschedulePost
      tags:
        - Publishing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Post ID to reschedule
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/JsonContentType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePostInput"
      responses:
        "200":
          description: Post rescheduled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Post scheduled successfully
                  data:
                    $ref: "#/components/schemas/Post"
        "400":
          description: Invalid scheduling time or post is not currently scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Cancel scheduled publishing and revert to draft
      description: Cancels scheduled publishing, removes the pending queue job, and
        reverts post status from SCHEDULED back to DRAFT.
      operationId: cancelScheduledPost
      tags:
        - Publishing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Post ID whose schedule should be cancelled
        - $ref: "#/components/parameters/OriginHeaderOptional"
      responses:
        "200":
          description: Schedule cancelled and post reverted to draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Post"
        "400":
          description: Post is not currently scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
