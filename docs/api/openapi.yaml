openapi: 3.1.0
info:
  title: Lumina API
  version: 1.0.0
  description: API endpoints are mounted below /api. System endpoints are at root.
servers:
  - url: http://localhost:3002
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /ok:
    get:
      summary: Simple health ping check
      responses:
        "200":
          description: OK message returned
      tags:
        - System
      operationId: getOk
      parameters: []
  /health:
    get:
      summary: Liveness probe check for API process
      responses:
        "200":
          description: Liveness status returned
      tags:
        - System
      operationId: getHealth
      parameters: []
  /ready:
    get:
      summary: Readiness probe check for Database and Redis dependencies
      responses:
        "200":
          description: Dependencies ready
        "530":
          description: Service unavailable
      tags:
        - System
      operationId: getReady
      parameters: []
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        "200":
          description: Prometheus text metrics returned
      tags:
        - System
      operationId: getMetrics
      parameters: []
  /api/auth/sign-up/email:
    post:
      summary: Register a new user account with email and password
      description: Creates a new user record in the database, establishes a Better
        Auth session, triggers user profile initialization hooks, and sets the
        HTTP session cookie.
      operationId: signUpWithEmail
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "200":
          description: User registered and authenticated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: User already exists or unprocessable input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/JsonContentType"
  /api/auth/sign-in/email:
    post:
      summary: Sign in to Lumina with email and password
      description: Authenticates credentials using Better Auth, returns user and
        session metadata, and attaches the HTTP-only session cookie.
      operationId: signInWithEmail
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/JsonContentType"
  /api/auth/verify-otp:
    post:
      summary: Verify email address with 6-digit OTP
      description: Validates the 6-digit verification code, consumes the OTP atomically, and marks the user's email as verified.
      operationId: verifyEmailOtp
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpInput"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyOtpResponse"
        "400":
          description: Invalid, expired, or incorrect OTP code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many verification attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/JsonContentType"
  /api/auth/resend-otp:
    post:
      summary: Resend email verification OTP
      description: Issues a replacement 6-digit verification OTP and dispatches it via Resend with a 60-second cooldown period.
      operationId: resendEmailOtp
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendOtpInput"
      responses:
        "200":
          description: Verification code sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendOtpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Resend cooldown active or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/JsonContentType"
  /api/auth/sign-out:
    post:
      summary: Sign out and revoke active session
      description: Revokes the active Better Auth session in database and clears the
        session cookie.
      operationId: signOut
      tags:
        - Authentication
      responses:
        "200":
          description: Successfully signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
  /api/auth/get-session:
    get:
      summary: Retrieve active authenticated session
      description: Returns the current session details and associated user profile for
        the requesting client.
      operationId: getSession
      tags:
        - Authentication
      responses:
        "200":
          description: Active session returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
      parameters: []
  /api/profile/test:
    get:
      summary: Test profile router connectivity
      description: Health ping for profile router confirming the route handler is
        responsive.
      operationId: testProfileRouter
      tags:
        - Users
      security: []
      responses:
        "200":
          description: Profile router is working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile router is working
      parameters: []
  /api/profile/me:
    get:
      summary: Get current user profile
      description: Retrieves comprehensive profile information for the authenticated
        user, including education, stats, and skills.
      operationId: getMyProfile
      tags:
        - Users
      responses:
        "200":
          description: Profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters: []
    patch:
      summary: Update current user profile
      description: Updates editable fields of the user profile. If leetcodeUsername is
        modified, enqueues background profile sync.
      operationId: updateMyProfile
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/JsonContentType"
  /api/profile/onboarding:
    post:
      summary: Save initial onboarding profile
      description: Persists initial profile details, college affiliation, and topic
        preferences during user onboarding.
      operationId: saveOnboardingProfile
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Onboarding profile saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/JsonContentType"
    patch:
      summary: Update onboarding profile details
      description: Modifies incomplete onboarding steps or student profile fields.
      operationId: updateOnboardingProfile
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Onboarding profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/JsonContentType"
  /api/profile/{username}:
    get:
      summary: Get public profile by username
      description: Retrieves a user public profile by their unique username.
      operationId: getProfileByUsername
      tags:
        - Users
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          description: Unique username of the target profile
          example: janedoe
      responses:
        "200":
          description: Public profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/profile/avatar:
    patch:
      summary: Upload user profile avatar
      description: Uploads and updates the user avatar picture via multipart
        form-data. Concurrently bounded.
      operationId: uploadProfileAvatar
      tags:
        - Users
        - Media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Avatar image file (JPEG, PNG, WebP up to 5MB)
      responses:
        "200":
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    example: https://lumina-bucket.s3.us-east-1.amazonaws.com/avatars/user-123.jpg
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/FormDataContentType"
    delete:
      summary: Delete user profile avatar
      description: Removes the current user avatar and resets it to default null.
      operationId: deleteProfileAvatar
      tags:
        - Users
        - Media
      responses:
        "200":
          description: Avatar deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeaderOptional"
  /api/profile/cover:
    patch:
      summary: Upload user profile cover banner
      description: Uploads and updates the user profile background cover banner image
        via multipart form-data.
      operationId: uploadProfileCover
      tags:
        - Users
        - Media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Cover image file (JPEG, PNG, WebP up to 5MB)
      responses:
        "200":
          description: Cover image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    example: https://lumina-bucket.s3.us-east-1.amazonaws.com/covers/cover-123.png
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/FormDataContentType"
    delete:
      summary: Delete user profile cover banner
      description: Removes the user cover image and resets it to null.
      operationId: deleteProfileCover
      tags:
        - Users
        - Media
      responses:
        "200":
          description: Cover image deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - $ref: "#/components/parameters/OriginHeaderOptional"
  /api/feed:
    get:
      summary: Get posts feed from the authenticated user's college
      description: Retrieves a paginated list of posts published within the user's
        campus community, enriched with like and save status for the viewer.
      operationId: getCollegeFeed
      tags:
        - Feed
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Number of posts to return (1-50, default 20)
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Pagination cursor (post ID from previous page)
      responses:
        "200":
          description: College feed returned successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - items
                      - nextCursor
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Post"
                            - type: object
                              properties:
                                isLiked:
                                  type: boolean
                                  example: false
                                isSaved:
                                  type: boolean
                                  example: false
                                totalComments:
                                  type: integer
                                  example: 5
                      nextCursor:
                        type: string
                        nullable: true
                        example: clpost999
        "400":
          description: User not associated with a college or invalid limit parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/friends:
    get:
      summary: List accepted friends
      responses:
        "200":
          description: Friends returned
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - Friends
      operationId: getFriends
      parameters: []
  /api/friends/request/{userId}:
    post:
      summary: Send a friend request to a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/OriginHeaderOptional"
      responses:
        "201":
          description: Friend request sent
        "400":
          description: Cannot send request
      tags:
        - Friends
      operationId: postFriendsRequestByUserId
  /api/friends/request/{requestId}/accept:
    patch:
      summary: Accept a pending friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/OriginHeaderOptional"
      responses:
        "200":
          description: Friend request accepted
      tags:
        - Friends
      operationId: patchFriendsRequestByRequestIdAccept
  /api/friends/request/{requestId}/reject:
    patch:
      summary: Reject a pending friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/OriginHeaderOptional"
      responses:
        "200":
          description: Friend request rejected
      tags:
        - Friends
      operationId: patchFriendsRequestByRequestIdReject
  /api/friends/request/{requestId}:
    delete:
      summary: Cancel an outgoing friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/OriginHeaderOptional"
      responses:
        "200":
          description: Request cancelled
      tags:
        - Friends
      operationId: deleteFriendsRequestByRequestId
  /api/friends/{friendId}:
    delete:
      summary: Remove a friend
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/OriginHeaderOptional"
      responses:
        "200":
          description: Friend removed
      tags:
        - Friends
      operationId: deleteFriendsByFriendId
  /api/friends/mutual/{userId}:
    get:
      summary: Get mutual friends with a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mutual friends array returned
      tags:
        - Friends
      operationId: getFriendsMutualByUserId
  /api/friends/requests/incoming:
    get:
      summary: List pending incoming friend requests
      responses:
        "200":
          description: Incoming requests returned
      tags:
        - Friends
      operationId: getFriendsRequestsIncoming
      parameters: []
  /api/friends/requests/outgoing:
    get:
      summary: List pending outgoing friend requests
      responses:
        "200":
          description: Outgoing requests returned
      tags:
        - Friends
      operationId: getFriendsRequestsOutgoing
      parameters: []
  /api/posts:
    post:
      summary: Create a new post
      description: Creates a post with rich blocks, text content, cover image, topics,
        and pre-uploaded or attached media.
      operationId: createPost
      tags:
        - Posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Post created successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      parameters:
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/JsonContentType"
  /api/posts/{id}/like:
    post:
      summary: Toggle like on a post
      description: Toggles the current authenticated user like on the specified post.
      operationId: togglePostLike
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique post ID
        - $ref: "#/components/parameters/OriginHeaderOptional"
      responses:
        "200":
          description: Like status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Like status updated successfully
                  data:
                    type: object
                    properties:
                      liked:
                        type: boolean
                        example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/posts/{id}/save:
    post:
      summary: Toggle bookmark save on a post
      description: Saves or removes the post from the authenticated user personal
        saved collection.
      operationId: togglePostSave
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique post ID
        - $ref: "#/components/parameters/OriginHeaderOptional"
      responses:
        "200":
          description: Post save toggled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  saved:
                    type: boolean
                    example: true
                  isSaved:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      saved:
                        type: boolean
                        example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/posts/saved:
    get:
      summary: List authenticated user saved posts
      description: Retrieves all posts bookmarked by the authenticated user.
      operationId: getMySavedPosts
      tags:
        - Posts
      responses:
        "200":
          description: Saved posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  savedPosts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: save-123
                        createdAt:
                          type: string
                          format: date-time
                        post:
                          $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters: []
  /api/posts/{id}/comments:
    get:
      summary: List comments for a post
      description: Fetches paginated comments associated with the post.
      operationId: listPostComments
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Post ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Comments list returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Add a comment to a post
      description: Creates a top-level comment or reply on the specified post.
      operationId: createPostComment
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Post ID
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/JsonContentType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  example: Great article!
                parentId:
                  type: string
                  nullable: true
                  example: null
      responses:
        "201":
          description: Comment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/posts/{id}/comments/{commentId}/pin:
    patch:
      summary: Pin or unpin a comment on a post
      description: Allows the post author to pin an important comment to the top of
        the comment section.
      operationId: pinPostComment
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Post ID
        - name: commentId
          in: path
          required: true
          schema:
            type: string
          description: Comment ID
        - $ref: "#/components/parameters/OriginHeaderOptional"
        - $ref: "#/components/parameters/JsonContentType"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                isPinned:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Comment pin status updated
          content:
