  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: The origin of the frontend application making the request.
      schema:
        type: string
        format: uri
        example: http://localhost:3002
      examples:
        default:
          summary: Local development origin
          value: http://localhost:3002
        frontend:
          summary: Configured frontend origin (CORS_ORIGIN)
          value: http://localhost:5173
    OriginHeaderRequired:
      name: Origin
      in: header
      required: true
      description: The origin of the frontend application making the request. Required
        for CSRF protection by Better Auth on authentication endpoints.
      schema:
        type: string
        format: uri
        example: http://localhost:3002
      examples:
        default:
          summary: Local development origin
          value: http://localhost:3002
        frontend:
          summary: Configured frontend origin (CORS_ORIGIN)
          value: http://localhost:5173
    OriginHeaderOptional:
      name: Origin
      in: header
      required: false
      description: The origin of the frontend application making the request.
        Validated by backend CSRF protection middleware on state-changing
        operations.
      schema:
        type: string
        format: uri
        example: http://localhost:3002
      examples:
        default:
          summary: Local development origin
          value: http://localhost:3002
        frontend:
          summary: Configured frontend origin (CORS_ORIGIN)
          value: http://localhost:5173
    JsonContentType:
      name: Content-Type
      in: header
      required: true
      description: The media type of the request body.
      schema:
        type: string
        example: application/json
    FormDataContentType:
      name: Content-Type
      in: header
      required: true
      description: The media type of the multipart request body.
      schema:
        type: string
        example: multipart/form-data
