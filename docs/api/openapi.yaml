components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: HTTP-only session cookie set by Better Auth upon sign-in or registration.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: BetterAuth Token
      description: "Bearer token passed in the Authorization header (e.g.
        `Authorization: Bearer <session_token>`)."
  responses:
    Unauthorized:
      description: Authentication required or invalid/expired session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Unauthorized
            code: UNAUTHORIZED
    Forbidden:
      description: Access forbidden - insufficient permissions or not the resource owner
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Forbidden
            code: FORBIDDEN
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Resource not found
            code: NOT_FOUND
    BadRequest:
      description: Invalid request parameters or payload validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Invalid payload
            code: BAD_REQUEST
    Conflict:
      description: Conflict due to existing resource or optimistic locking version conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Concurrent update conflict
            code: CONFLICT
    InternalError:
      description: Unexpected internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: An unexpected error occurred.
            code: INTERNAL_ERROR
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Resource not found
        code:
          type: string
          example: NOT_FOUND
        errors:
          type: array
          items:
            type: object
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          example: cluser123456789
        email:
          type: string
          format: email
          example: student@lumina.edu
        name:
          type: string
          example: Jane Doe
        role:
          type: string
          enum:
            - STUDENT
            - ALUMNI
            - FACULTY
            - ADMIN
          example: STUDENT
        status:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - SUSPENDED
            - DELETED
          example: ACTIVE
        collegeId:
          type: string
          nullable: true
          example: col-123
        departmentId:
          type: string
          nullable: true
          example: dept-456
        image:
          type: string
          nullable: true
          example: https://lumina-bucket.s3.us-east-1.amazonaws.com/avatars/user-123.jpg
        emailVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2026-09-01T12:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-10-15T12:00:00.000Z
    Profile:
      type: object
      required:
        - id
        - userId
        - firstName
        - lastName
        - email
      properties:
        id:
          type: string
          example: clprof123
        userId:
          type: string
          example: cluser123456789
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@lumina.edu
        bio:
          type: string
          nullable: true
          example: Computer Science student passionate about distributed systems.
        about:
          type: string
          nullable: true
          example: Senior undergrad working on open source publishing platforms.
        profilePicture:
          type: string
          nullable: true
          example: https://lumina-bucket.s3.us-east-1.amazonaws.com/avatars/avatar-123.png
