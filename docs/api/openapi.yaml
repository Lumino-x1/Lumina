openapi: 3.1.0
info:
  title: Lumina API
  version: 1.0.0
  description: API endpoints are mounted below /api. System endpoints are at root.
servers:
  - url: http://localhost:3002
security:
  - sessionCookie: []
paths:
  /ok:
    get:
      summary: Simple health ping check
      responses:
        '200': { description: OK message returned }
  /health:
    get:
      summary: Liveness probe check for API process
      responses:
        '200': { description: Liveness status returned }
  /ready:
    get:
      summary: Readiness probe check for Database and Redis dependencies
      responses:
        '200': { description: Dependencies ready }
        '530': { description: Service unavailable }
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        '200': { description: Prometheus text metrics returned }

  /api/profile/me:
    get:
      summary: Get current user profile
      responses:
        '200': { description: Profile returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update or create current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated profile returned }
  /api/profile/onboarding:
    post:
      summary: Save initial user onboarding profile and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Onboarding profile saved }
    patch:
      summary: Update onboarding profile details
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Onboarding profile updated }
  /api/profile/{username}:
    get:
      summary: Get public profile by username
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: User profile returned }
        '404': { description: Profile not found }

  /api/friends:
    get:
      summary: List accepted friends
      responses:
        '200': { description: Friends returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/feed:
    get:
      summary: Get posts from the authenticated user's college
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: College feed returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, example: "post-123" }
                            title: { type: string, example: "Campus Hackathon" }
                            subtitle: { type: string, nullable: true }
                            likeCount: { type: integer, example: 10 }
                            isLiked: { type: boolean, example: true }
                            saveCount: { type: integer, example: 4 }
                            isSaved: { type: boolean, example: false }
                            commentCount: { type: integer, example: 2 }
                            viewCount: { type: integer, example: 50 }
                            shareCount: { type: integer, example: 1 }
                      nextCursor: { type: string, nullable: true, example: "post-123" }
        '400': { description: User is not associated with a college or the limit is invalid }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/friends/request/{userId}:
    post:
      summary: Send a friend request to a user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Friend request sent }
        '400': { description: Cannot send request }
  /api/friends/request/{requestId}/accept:
    patch:
      summary: Accept a pending friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Friend request accepted }
  /api/friends/request/{requestId}/reject:
    patch:
      summary: Reject a pending friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Friend request rejected }
  /api/friends/request/{requestId}:
    delete:
      summary: Cancel an outgoing friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Request cancelled }
  /api/friends/{friendId}:
    delete:
      summary: Remove a friend
      parameters:
        - name: friendId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Friend removed }
  /api/friends/mutual/{userId}:
    get:
      summary: Get mutual friends with a user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Mutual friends array returned }
  /api/friends/requests/incoming:
    get:
      summary: List pending incoming friend requests
      responses:
        '200': { description: Incoming requests returned }
  /api/friends/requests/outgoing:
    get:
      summary: List pending outgoing friend requests
      responses:
        '200': { description: Outgoing requests returned }

  /api/posts:
    post:
      summary: Create a post with optional media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content: { type: string }
                visibility: { type: string, enum: [PUBLIC, COLLEGE, FRIENDS, PRIVATE] }
                media: { type: array, items: { type: string, format: binary } }
      responses:
        '201': { description: Post created }
  /api/posts/{id}/like:
    post:
      summary: Toggle like on a post
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Like toggled }
  /api/posts/{id}/save:
    post:
      summary: Save or unsave a post
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Post save toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  saved: { type: boolean }
                  isSaved: { type: boolean }
                  data:
                    type: object
                    properties:
                      saved: { type: boolean }
                      isSaved: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Post not found }
  /api/posts/saved:
    get:
      summary: Get list of saved posts
      responses:
        '200': { description: Saved posts returned }

  /api/chat/token:
    get:
      summary: Generate Stream Chat token
      responses:
        '200': { description: Stream token returned }
  /api/chat/conversations:
    post:
      summary: Create 1-on-1 chat conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { type: string }
      responses:
        '201': { description: Conversation created }
    get:
      summary: List user conversations
      responses:
        '200': { description: Conversations array returned }

  /api/leaderboard:
    get:
      summary: Get paginated LeetCode leaderboard
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: query
          in: query
          schema: { type: string }
      responses:
        '200': { description: Leaderboard returned }
  /api/leaderboard/me/around:
    get:
      summary: Get leaderboard users around the current user
      responses:
        '200': { description: Surrounding leaderboard users returned }
  /api/leaderboard/me:
    get:
      summary: Get current user leaderboard rank and stats
      responses:
        '200': { description: Current user stats returned }
  /api/leaderboard/{userId}:
    get:
      summary: Get specific user leaderboard rank and stats
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: User leaderboard stats returned }

  /api/leetcode/sync:
    post:
      summary: Manually trigger LeetCode profile metrics synchronization
      responses:
        '200': { description: Sync initiated }

  /api/video/token:
    post:
      summary: Generate Stream Video authentication token
      responses:
        '200': { description: Token and Stream API Key returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limit exceeded }
  /api/video/calls:
    post:
      summary: Initialize a new 1-on-1 or group video call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  {
                    type: string,
                    enum: [ONE_ON_ONE, GROUP, MENTORSHIP, CLUB_MEETING, FACULTY_SESSION],
                  }
                title: { type: string }
                participantIds: { type: array, items: { type: string } }
      responses:
        '201': { description: Video call created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/video/calls/history:
    get:
      summary: List past video calls for the authenticated user
      responses:
        '200': { description: Call history array returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/video/calls/{callId}:
    get:
      summary: Get details of a specific video call
      parameters:
        - name: callId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Call details returned }
  /api/video/calls/{callId}/join:
    post:
      summary: Join an active video call
      parameters:
        - name: callId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Call joined }
  /api/video/calls/{callId}/respond:
    post:
      summary: Accept or decline a video call invite
      parameters:
        - name: callId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        '200': { description: Response recorded }
  /api/video/calls/{callId}/end:
    post:
      summary: End an active video call
      parameters:
        - name: callId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Call ended }

  /api/comments/posts/{postId}/comments:
    post:
      summary: Create a root comment or nested reply attached to a post
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                parentId: { type: string }
      responses:
        '201': { description: Comment or reply created }
        '400': { description: Invalid content or parent post mismatch }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Max comment depth 10 exceeded }
    get:
      summary: Fetch comments tree for a post with cursor pagination and formatted reaction counts
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: Comments tree returned }
        '404': { description: Post not found }
  /api/comments/{commentId}:
    patch:
      summary: Edit a comment (owner-only, tracked in edit history, concurrent-edit safe)
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200': { description: Comment updated }
        '403': { description: Not authorized to edit comment }
        '409': { description: Stale comment version concurrent conflict }
    delete:
      summary: Soft delete comment (tombstone preserving reply tree)
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Comment soft deleted }
        '403': { description: Not authorized to delete comment }
  /api/comments/{commentId}/history:
    get:
      summary: Fetch edit history log for a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Array of edit history entries returned }
        '404': { description: Comment not found }
  /api/comments/{commentId}/reactions:
    post:
      summary: Toggle or add emoji reaction to a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string }
      responses:
        '200': { description: Reaction toggled }
        '400': { description: Cannot react to deleted comment }
    delete:
      summary: Remove emoji reaction from a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string }
      responses:
        '200': { description: Reaction removed }
  /api/comments/{commentId}/pin:
    post:
      summary: Pin or unpin a comment (post owner, admin, or moderator, max 3 pins per post)
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pin state toggled }
        '400': { description: Max pinned comments limit exceeded }
        '403': { description: Not authorized to pin comment }
  /api/comments/{commentId}/report:
    post:
      summary: Report a comment for moderation
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                details: { type: string }
      responses:
        '201': { description: Report submitted }
        '409': { description: Already reported comment }

  /api/v1/study-groups:
    get:
      summary: List study groups the current user belongs to
      responses:
        '200': { description: Study groups returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a study group (SUBJECT, EXAM, PROJECT, or ASSIGNMENT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, visibility, subject, semester]
              properties:
                name: { type: string }
                type: { type: string, enum: [SUBJECT, EXAM, PROJECT, ASSIGNMENT] }
                visibility: { type: string, enum: [PUBLIC, PRIVATE] }
                subject: { type: string }
                semester: { type: integer }
                description: { type: string, nullable: true }
      responses:
        '201': { description: Study group created }
        '400': { description: Invalid payload }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/study-groups/search:
    get:
      summary: Search groups and content the current user can access
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Search results returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/study-groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a study group by id
      responses:
        '200': { description: Study group returned }
        '404': { description: Study group not found }
    patch:
      summary: Update a study group (owner or admin)
      parameters:
        - name: If-Match
          in: header
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Study group updated }
        '403': { description: Insufficient permissions }
        '412': { description: Version conflict }
    delete:
      summary: Delete a study group (owner)
      responses:
        '200': { description: Study group deleted }
        '403': { description: Insufficient permissions }
  /api/v1/study-groups/{groupId}/join:
    post:
      summary: Join a public study group or accept a private invitation
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Membership created }
        '403': { description: Invitation required for private groups }
  /api/v1/study-groups/{groupId}/leave:
    post:
      summary: Leave a study group
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Left the group }
        '403': { description: Owner cannot leave }
  /api/v1/study-groups/{groupId}/members:
    get:
      summary: List study group members
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Members returned }
  /api/v1/study-groups/{groupId}/invitations:
    post:
      summary: Invite a user to a study group
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                message: { type: string }
      responses:
        '201': { description: Invitation created }
        '409': { description: Already a member }
  /api/v1/study-groups/{groupId}/members/{userId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
      - name: userId
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Change a member role (ADMIN or MEMBER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [ADMIN, MEMBER] }
      responses:
        '200': { description: Member role updated }
        '403': { description: Insufficient permissions }
    delete:
      summary: Remove a member from the group
      responses:
        '200': { description: Member removed }
  /api/v1/study-groups/{groupId}/discussions:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List discussion threads
      responses:
        '200': { description: Discussions returned }
    post:
      summary: Create a discussion thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
      responses:
        '201': { description: Discussion created }
  /api/v1/study-groups/{groupId}/discussions/{discussionId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
      - name: discussionId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a discussion thread
      responses:
        '200': { description: Discussion returned }
        '404': { description: Discussion not found }
    patch:
      summary: Edit own discussion (or moderate)
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Discussion updated }
    delete:
      summary: Delete own discussion (or moderate)
      responses:
        '200': { description: Discussion deleted }
  /api/v1/study-groups/{groupId}/discussions/{discussionId}/replies:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
      - name: discussionId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List discussion replies
      responses:
        '200': { description: Replies returned }
    post:
      summary: Reply to a discussion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '201': { description: Reply created }
  /api/v1/study-groups/{groupId}/discussions/{discussionId}/replies/{replyId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
      - name: discussionId
        in: path
        required: true
        schema: { type: string }
      - name: replyId
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Edit own reply (or moderate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '200': { description: Reply updated }
    delete:
      summary: Delete own reply (or moderate)
      responses:
        '200': { description: Reply deleted }
  /api/v1/study-groups/{groupId}/notes:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List shared notes
      responses:
        '200': { description: Notes returned }
    post:
      summary: Create a shared note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
      responses:
        '201': { description: Note created }
  /api/v1/study-groups/{groupId}/notes/{noteId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
      - name: noteId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a shared note
      responses:
        '200': { description: Note returned }
    patch:
      summary: Edit a note and append a version snapshot
      parameters:
        - name: If-Match
          in: header
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Note updated }
        '412': { description: Version conflict }
    delete:
      summary: Delete a note
      responses:
        '200': { description: Note deleted }
  /api/v1/study-groups/{groupId}/notes/{noteId}/versions:
    get:
      summary: List note version history
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Note versions returned }
  /api/v1/study-groups/{groupId}/notes/{noteId}/versions/{version}:
    get:
      summary: Get a specific note version
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
        - name: noteId
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Note version returned }
        '404': { description: Version not found }
  /api/v1/study-groups/{groupId}/files/upload-url:
    post:
      summary: Create a validated object-storage upload URL
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, sizeBytes]
              properties:
                fileName: { type: string }
                mimeType: { type: string }
                sizeBytes: { type: integer }
      responses:
        '200': { description: Presigned upload URL returned }
        '400': { description: File validation failed }
  /api/v1/study-groups/{groupId}/files:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List academic files
      responses:
        '200': { description: Files returned }
    post:
      summary: Register an uploaded academic file
      requestBody:
        required: true
        content:
